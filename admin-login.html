<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Hostello</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="home.html" class="nav-brand">
      <img src="images/logo-white.svg" alt="Hostello" class="nav-logo">Host<span>ello</span>
    </a>
    <ul class="nav-menu">
      <li><a href="home.html">Home</a></li>
      <li><a href="student-login.html">Student Login</a></li>
    </ul>
  </nav>

  <div class="auth-page">
    <div class="auth-box">
      <h1>Admin Login 🔐</h1>
      <p class="subtitle">Access the Hostello admin dashboard</p>
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminUsername">Admin Username</label>
          <input type="text" id="adminUsername" placeholder="Enter admin username" required>
          <span class="hint">Default username: admin</span>
        </div>
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" placeholder="Enter admin password" required>
          <span class="hint">Default password: admin123</span>
        </div>
        <button type="submit" class="btn-primary auth-submit">Login to Dashboard</button>
      </form>
      <p class="form-link"><a href="student-login.html">← Back to Student Login</a></p>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
