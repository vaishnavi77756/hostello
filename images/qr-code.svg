<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple QR code pattern -->
  <rect width="200" height="200" fill="white"/>
  
  <!-- Corner markers -->
  <rect x="10" y="10" width="50" height="50" fill="none" stroke="black" stroke-width="8"/>
  <rect x="25" y="25" width="20" height="20" fill="black"/>
  
  <rect x="140" y="10" width="50" height="50" fill="none" stroke="black" stroke-width="8"/>
  <rect x="155" y="25" width="20" height="20" fill="black"/>
  
  <rect x="10" y="140" width="50" height="50" fill="none" stroke="black" stroke-width="8"/>
  <rect x="25" y="155" width="20" height="20" fill="black"/>
  
  <!-- Pattern blocks -->
  <rect x="80" y="20" width="10" height="10" fill="black"/>
  <rect x="100" y="20" width="10" height="10" fill="black"/>
  <rect x="80" y="40" width="10" height="10" fill="black"/>
  <rect x="120" y="40" width="10" height="10" fill="black"/>
  
  <rect x="70" y="80" width="10" height="10" fill="black"/>
  <rect x="90" y="80" width="10" height="10" fill="black"/>
  <rect x="110" y="80" width="10" height="10" fill="black"/>
  <rect x="130" y="80" width="10" height="10" fill="black"/>
  
  <rect x="80" y="100" width="10" height="10" fill="black"/>
  <rect x="100" y="100" width="10" height="10" fill="black"/>
  <rect x="120" y="100" width="10" height="10" fill="black"/>
  
  <rect x="70" y="120" width="10" height="10" fill="black"/>
  <rect x="110" y="120" width="10" height="10" fill="black"/>
  <rect x="130" y="120" width="10" height="10" fill="black"/>
  
  <rect x="80" y="140" width="10" height="10" fill="black"/>
  <rect x="100" y="140" width="10" height="10" fill="black"/>
  <rect x="140" y="140" width="10" height="10" fill="black"/>
  
  <rect x="90" y="160" width="10" height="10" fill="black"/>
  <rect x="120" y="160" width="10" height="10" fill="black"/>
  <rect x="150" y="160" width="10" height="10" fill="black"/>
  
  <!-- Center text -->
  <text x="100" y="105" font-family="Arial" font-size="12" fill="black" text-anchor="middle">HOSTELLO</text>
</svg>
